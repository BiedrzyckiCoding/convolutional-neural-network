name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # Step 1 — make sure the code is clean before we run anything
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # E501 = line too long; we allow up to 100 chars for readability
        run: flake8 cifar10_cnn.py --max-line-length=100 --statistics

  # Step 2 — smoke-test the model end-to-end (tiny data, 1 epoch)
  smoke-test:
    name: Smoke Test
    needs: lint          # only runs when lint passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (graphviz for plot_model)
        run: sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run model smoke test
        # --ci flag: 500 training samples, 1 epoch — verifies the full
        # pipeline (load → build → train → evaluate → save → plots) without
        # spending 10+ minutes on a full training run
        run: python cifar10_cnn.py --ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-outputs
          path: |
            cifar10_model.keras
            model_plot.png
            history_plot.png
            confusion_matrix.png
            misclassified_*.png
